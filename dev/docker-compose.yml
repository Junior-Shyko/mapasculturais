services:
  mapas:
    build:
      context: ../
      args:
        - COMPOSER_ARGS= 
      dockerfile: docker/Dockerfile
    command: /var/www/dev/start.sh
    ports:
      - "80:80"
    volumes:
      - ./docker/php.ini:/usr/local/etc/php/php.ini
      - ./docker/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
      # scripts principais
      - ../docker/entrypoint.sh:/entrypoint.sh
      - ../docker/jobs-cron.sh:/jobs-cron.sh
      - ../docker/recreate-pending-pcache-cron.sh:/recreate-pending-pcache-cron.sh
      - ../docker/cleanup-orphan-assets-cron.sh:/cleanup-orphan-assets-cron.sh

      - ../composer.json:/var/www/composer.json
      - ../composer.lock:/var/www/composer.lock

      - ../config:/var/www/config
      - ../public:/var/www/html
      - ../scripts:/var/www/scripts
      - ../src:/var/www/src
      - ../var:/var/www/var

      - ../docker/development/router.php:/var/www/router.php

      - ./config.d:/var/www/config/config.d

      - ./docker-data/assets:/var/www/html/assets
      - ./docker-data/public-files:/var/www/html/files
      - ./docker-data/private-files:/var/www/private-files
      
      - ../docker/development/router.php:/var/www/dev/router.php
      ## Theme (submódulo em src/themes/Pnab, já incluído no mount de ../src)
      - ../src/themes/Pnab:/var/www/src/themes/Pnab
      ## Plugin AldirBlanc (submódulo em src/plugins/AldirBlanc)
      - ../src/plugins/AldirBlanc:/var/www/src/plugins/AldirBlanc

    links:
      - db
      - redis
      - sessions
      
    environment:
      - REDIRECT_404_ASSETS_TO=
      - BUILD_ASSETS=1
      - CI=true
      - PENDING_PCACHE_RECREATION_INTERVAL=5
      - JOBS_INTERVAL=5
      - REDIS_CACHE=redis
      - MAILER_TRANSPORT=smtp://mailhog:1025
      - MAILER_FROM=sysadmin@localhost
      - NUM_PROCESSES=2
      - MC_UPDATES_PROCESSES=4
      
      # chaves de teste do google recaptcha
      - GOOGLE_RECAPTCHA_SITEKEY=6LdpNqotAAAAAGTY2DjyY0TP1PZcrzG0MBpwjxpp
      - GOOGLE_RECAPTCHA_SECRET=6LdpNqotAAAAAKz3eNAfIkyRTWuOaahfLd9-ZAU7
      # usadas pelo componente mc-captcha (login da Pnab); sem elas config/captcha.php
      # resolve sitekey/secret como null e o widget de login nunca renderiza
      - CAPTCHA_SITEKEY=6LdpNqotAAAAAGTY2DjyY0TP1PZcrzG0MBpwjxpp
      - CAPTCHA_SECRET=6LdpNqotAAAAAKz3eNAfIkyRTWuOaahfLd9-ZAU7

      - SESSIONS_SAVE_PATH=tcp://sessions:6379

      - PNAB_CULTBR_MODE=development
      - PNAB_CULTBR_HOST=https://back.gestao.hmg.cultbr.cultura.gov.br/api/v1
      - PNAB_CULTBR_TOKEN=““

      # PRIMEIRA FASE DA INTEGRAÇÃO (BUSCAR DADOS DO GESTOR E ENTES FEDERADOS)
      - PNAB_CULTBR_SEFIC_ENDPOINT="par/sefic"
      - PNAB_CULTBR_GESTOR_ENDPOINT="pessoa/{document}"

      # SEGUNDA FASE DA INTEGRAÇÃO (ENVIO DE OPPORTUNIDADES PARA O BACKEND DO CULTBR)
      - PNAB_CULTBR_CREATE_OPORTUNIDADE_ENDPOINT="integracao/oportunidades"
      - PNAB_CULTBR_UPDATE_OPORTUNIDADE_ENDPOINT="integracao/oportunidades/{id}"
      - ALDIRBLANC_SUBSITE_ID=103
      - ALDIRBLANC_APPLICATION_NAME="ALDIRBLANC_TOKEN_CULTBR"
      - ALDIRBLANC_INTEGRATION_CACHE_TTL=
      - ALDIRBLANC_INTEGRATION_DELAY_JOB='+10 seconds'
      - ALDIRBLANC_INTEGRATION_RETRY_DELAY_JOB='+15 seconds'

      # DADOS DO PAR
      - PNAB_CULTBR_PAR_ACOES_ENDPOINT="par/sefic/acoes"
    depends_on:
      - db
      - redis
      - sessions
      - mailhog
    stdin_open: true
    tty: true
    
  mailhog: 
    image: mailhog/mailhog
    ports:
      - "8025:8025"

  redis:
    image: redis:6
    command: --maxmemory 256Mb --maxmemory-policy allkeys-lru  

  sessions:
    image: redis:6
    restart: unless-stopped
    command: --maxmemory 128Mb --maxmemory-policy allkeys-lru
    volumes:
      - ./docker-data/sessions:/data

  db:
    image: postgis/postgis:14-master
    environment:
      - POSTGRES_PASSWORD=mapas
      - POSTGRES_USER=mapas
      - POSTGRES_DB=mapas
      

    ports:
      - "5432:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
